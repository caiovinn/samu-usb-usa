[project]
name = "samu-usb-usa"
version = "0.2.0"
description = "Realocacao da frota movel do SAMU separando USB de USA (MAI5003)"
readme = "SETUP.md"
requires-python = ">=3.12,<3.13"

# Tudo o que fase 1 e fase 2 usam, junto -- um "uv sync" instala o suficiente
# para rodar qualquer script do repositorio, coleta inclusive.
#
#   pyarrow nunca aparece num `import`: e o motor de parquet do pandas, usado
#   por todo to_parquet/read_parquet. Sem declarar, a instalacao limpa quebra
#   na primeira escrita.
#
#   matplotlib>=3.9 junto de numpy>=2 e requisito herdado da fase 1: a maquina
#   original tinha numpy 2.4.6 ao lado de matplotlib 3.6.2 compilado contra
#   numpy 1.x, e nenhum dos dois carregava. Ver SETUP.md.
dependencies = [
    "numpy>=2",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "requests>=2.32",
    "osmnx>=2.0",
    "pyogrio>=0.9",
    "geopandas>=1.0",
    "pysus>=0.15",
]

[tool.uv]
# Colecao de scripts, nao uma biblioteca: nao ha nada para construir/instalar.
package = false
